name: Build and Test
on:
  pull_request:
    branches: [ master-servicetitan ]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  DO_TargetFrameworks: net10.0
jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # --blame-hang-timeout is per test; the test host is killed without a dump when it is exceeded
      CORE_TEST_ARGS: -c Release --no-build -v n --blame-hang-timeout 10min --blame-hang-dump-type none
      EXT_TEST_ARGS: -c Release --no-build -v n --blame-hang-timeout 1min --blame-hang-dump-type none
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10
      - name: Build
        run: dotnet build -c Release -v q
      - name: Tests.Core
        run: dotnet test Orm/Xtensive.Orm.Tests.Core/Xtensive.Orm.Tests.Core.csproj $CORE_TEST_ARGS --filter 'TestCategory!=Mute'
      - name: Logging.log4net.Tests
        if: ${{ !cancelled() }}
        run: dotnet test Extensions/Xtensive.Orm.Logging.log4net.Tests/Xtensive.Orm.Logging.log4net.Tests.csproj $EXT_TEST_ARGS --filter 'TestCategory!=Mute'
      - name: Logging.NLog.Tests
        if: ${{ !cancelled() }}
        run: dotnet test Extensions/Xtensive.Orm.Logging.NLog.Tests/Xtensive.Orm.Logging.NLog.Tests.csproj $EXT_TEST_ARGS --filter 'TestCategory!=Mute'
