name: Build and Test
on:
  pull_request:
    branches: [ master-servicetitan ]
env:
  DO_TargetFrameworks: net10.0
jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10
      - name: Build
        run: dotnet build -c Release -v q
      - name: Tests.Core
        run: dotnet test -c Release --no-build -v n Orm/Xtensive.Orm.Tests.Core/Xtensive.Orm.Tests.Core.csproj --filter 'TestCategory!=Mute'
      - name: Logging.log4net.Tests
        if: ${{ !cancelled() }}
        run: dotnet test -c Release --no-build -v n Extensions/Xtensive.Orm.Logging.log4net.Tests/Xtensive.Orm.Logging.log4net.Tests.csproj --filter 'TestCategory!=Mute'
      - name: Logging.NLog.Tests
        if: ${{ !cancelled() }}
        run: dotnet test -c Release --no-build -v n Extensions/Xtensive.Orm.Logging.NLog.Tests/Xtensive.Orm.Logging.NLog.Tests.csproj --filter 'TestCategory!=Mute'
