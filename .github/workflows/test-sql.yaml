name: Tests with SQL Server
on:
  pull_request:
    branches: [ master-servicetitan ]
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DO_CONFIG_FILE: "/tmp/do-test.cfg"
  DO_TargetFrameworks: net10.0
  SQL_PASSWD: dbatools.I0
jobs:
  sql-image:
    name: Build SQL Server image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build SQL Docker image with FTS feature
        run: docker build -t sql .github/actions/mssql-fts
      - name: Save image
        run: docker save sql | zstd -T0 -3 -o sql-image.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: sql-image
          path: sql-image.tar.zst
          compression-level: 0
          retention-days: 1

  test-with-sql:
    name: SQL tests (${{ matrix.shard }})
    needs: sql-image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Orm.Tests is split by namespace; Rest is the complement of the others, so no test is skipped
        include:
          - shard: Issues
            filter: FullyQualifiedName~Xtensive.Orm.Tests.Issues.
          - shard: Linq
            filter: FullyQualifiedName~Xtensive.Orm.Tests.Linq.
          - shard: Storage
            filter: FullyQualifiedName~Xtensive.Orm.Tests.Storage.
          - shard: Rest
            filter: FullyQualifiedName!~Xtensive.Orm.Tests.Issues.&FullyQualifiedName!~Xtensive.Orm.Tests.Linq.&FullyQualifiedName!~Xtensive.Orm.Tests.Storage.
            other_suites: true
    steps:
      - uses: actions/checkout@v4
      - uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "UTC"
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x
      - name: Setup MSSQL Tools
        uses:  rails-sqlserver/setup-mssql@v1
        with:
          components: sqlcmd
          version: 2022
      - uses: actions/download-artifact@v4
        with:
          name: sql-image
      - name: Load SQL Docker image
        run: zstd -d -c sql-image.tar.zst | docker load
#      - uses: ikalnytskyi/action-setup-postgres@v6 
#      - name: Init PostgreSQL Test DB
#        run: |
#            createuser dotest
#            createdb --owner dotest dotest
#            psql -c "ALTER USER dotest WITH PASSWORD 'dotest' SUPERUSER"
#        env:
#            PGSERVICE: postgres
      - name: Run SQL Server container
        run: docker run -e ACCEPT_EULA=Y -e MSSQL_PID='Developer' -e MSSQL_SA_PASSWORD=${SQL_PASSWD} -p 1433:1433 -d sql
      - name: Build
        run: dotnet build -v q Orm.slnx
      - name: Init Test DB
        run: sqlcmd -U sa -P $SQL_PASSWD -C -i Orm/Xtensive.Orm.Tests.Framework/DO-Tests.sql && sqlcmd -U sa -P $SQL_PASSWD -C -i Orm/Xtensive.Orm.Tests.Framework/DO-Tests-Plus.sql
      # Same dotest login as Containers/mssql/setup.sql; some Tests.Sql tests connect with it directly
      - name: Create dotest login
        run: |
          sqlcmd -b -U sa -P "$SQL_PASSWD" -C -Q "CREATE LOGIN [dotest] WITH PASSWORD=N'dotest', DEFAULT_DATABASE=[master], CHECK_EXPIRATION=OFF, CHECK_POLICY=OFF"
          for db in DO-Tests DO-Tests-1 DO-Tests-2 DO-Tests-3 DO-Tests-4; do
            sqlcmd -b -U sa -P "$SQL_PASSWD" -C -d "$db" -Q "CREATE USER [dotest] FOR LOGIN [dotest] WITH DEFAULT_SCHEMA=[dbo]; ALTER ROLE [db_owner] ADD MEMBER [dotest]"
          done
#      - name: Create PostgreSQL DO Tests Config file
#        run: echo default=postgresql://dotest:dotest@localhost/dotest >$DO_CONFIG_FILE
#      - name: Xtensive.Orm.Tests.Sql with PostgreSQL
#        run: dotnet test --no-build -v n Orm/Xtensive.Orm.Tests.Sql/Xtensive.Orm.Tests.Sql.csproj --filter 'TestCategory!=Mute'
#        env:
#            DO_STORAGE: pgsql160
#      - name: Xtensive.Orm.Tests with PostgreSQL
#        run: dotnet test --no-build -v n Orm/Xtensive.Orm.Tests/Xtensive.Orm.Tests.csproj --filter '(TestCategory!=Mute)&(TestCategory!=MutePostgreSql)'
#        env:
#            DO_STORAGE: pgsql160
      - name: Create SQL Server DO Tests Config file
        run: echo default=sqlserver://sa:${SQL_PASSWD}@localhost/DO-Tests?MultipleActiveResultSets=True >$DO_CONFIG_FILE
      - name: Xtensive.Orm.Tests with SQL Server
        run: dotnet test --no-build -v n Orm/Xtensive.Orm.Tests/Xtensive.Orm.Tests.csproj --filter 'TestCategory!=Mute&(${{ matrix.filter }})'
        env:
            DO_STORAGE: default
      - name: Xtensive.Orm.Tests.Sql with SQL Server
        if: ${{ !cancelled() && matrix.other_suites }}
        run: dotnet test --no-build -v n Orm/Xtensive.Orm.Tests.Sql/Xtensive.Orm.Tests.Sql.csproj --filter 'TestCategory!=Mute'
        env:
            DO_STORAGE: default
      - name: Xtensive.Orm.BulkOperations.Tests with SQL Server
        if: ${{ !cancelled() && matrix.other_suites }}
        run: dotnet test --no-build -v n Extensions/Xtensive.Orm.BulkOperations.Tests/Xtensive.Orm.BulkOperations.Tests.csproj --filter 'TestCategory!=Mute'
        env:
            DO_STORAGE: default
      - name: Xtensive.Orm.Localization.Tests with SQL Server
        if: ${{ !cancelled() && matrix.other_suites }}
        run: dotnet test --no-build -v n Extensions/Xtensive.Orm.Localization.Tests/Xtensive.Orm.Localization.Tests.csproj --filter 'TestCategory!=Mute'
        env:
            DO_STORAGE: default
      - name: Xtensive.Orm.Reprocessing.Tests with SQL Server
        if: ${{ !cancelled() && matrix.other_suites }}
        # concurrent reprocessing tests can loop forever
        timeout-minutes: 10
        run: dotnet test --no-build -v n Extensions/Xtensive.Orm.Reprocessing.Tests/Xtensive.Orm.Reprocessing.Tests.csproj --filter 'TestCategory!=Mute'
        env:
            DO_STORAGE: default
      - name: Xtensive.Orm.Security.Tests with SQL Server
        if: ${{ !cancelled() && matrix.other_suites }}
        run: dotnet test --no-build -v n Extensions/Xtensive.Orm.Security.Tests/Xtensive.Orm.Security.Tests.csproj --filter 'TestCategory!=Mute'
        env:
            DO_STORAGE: default
      - name: Xtensive.Orm.Tracking.Tests with SQL Server
        if: ${{ !cancelled() && matrix.other_suites }}
        run: dotnet test --no-build -v n Extensions/Xtensive.Orm.Tracking.Tests/Xtensive.Orm.Tracking.Tests.csproj --filter 'TestCategory!=Mute'
        env:
            DO_STORAGE: default

  # Single status for branch protection and the [org] Tests Passed check
  sql-tests:
    name: SQL tests
    needs: test-with-sql
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check all shards passed
        run: test "${{ needs.test-with-sql.result }}" = success


